<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab 5 API Verification</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #edf2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 15% 0%, rgba(57, 189, 248, .15), transparent 38%),
        #0b1020;
    }
    main {
      width: min(920px, 100%);
      background: #111831;
      border: 1px solid #2a355a;
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
      overflow: hidden;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 22px 26px;
      border-bottom: 1px solid #2a355a;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: .01em; }
    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #9fe7bf;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .live::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #3ddc84;
      box-shadow: 0 0 0 5px rgba(61, 220, 132, .12);
    }
    section { padding: 24px 26px; }
    .label {
      margin-bottom: 9px;
      color: #8fa1cf;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .request-line {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 17px;
    }
    .method {
      min-width: 74px;
      padding: 7px 10px;
      border-radius: 8px;
      background: #243154;
      color: #8fd8ff;
      text-align: center;
      font-weight: 800;
    }
    .url { overflow-wrap: anywhere; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(61, 220, 132, .12);
      color: #9fe7bf;
      font-weight: 800;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .grid.single { grid-template-columns: 1fr; }
    .panel {
      min-width: 0;
      padding: 17px;
      border: 1px solid #2a355a;
      border-radius: 12px;
      background: #0c1329;
    }
    pre {
      margin: 0;
      min-height: 120px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: #d8e3ff;
      font: 14px/1.55 "Cascadia Code", Consolas, monospace;
    }
    .muted { color: #7182af; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Lab 5 API Verification</h1>
      <div class="live">Live response</div>
    </header>
    <section>
      <div class="label">Request</div>
      <div class="request-line">
        <span class="method" id="method">GET</span>
        <span class="url" id="url">Connecting...</span>
      </div>
      <div class="status" id="status">Waiting for response</div>
      <div class="grid" id="grid">
        <div class="panel" id="request-panel">
          <div class="label">JSON body</div>
          <pre id="request-body" class="muted">No request body</pre>
        </div>
        <div class="panel">
          <div class="label">JSON response</div>
          <pre id="response-body">Loading...</pre>
        </div>
      </div>
    </section>
  </main>
  <script>
    const baseUrl = "http://127.0.0.1:5000";
    const testCase = new URLSearchParams(location.search).get("case") || "get-all";

    const tests = {
      "get-all": { method: "GET", path: "/api/users" },
      "get-single": { method: "GET", path: "/api/users/1" },
      add: {
        method: "POST",
        path: "/api/users/add",
        body: {
          name: "Alice Khalil",
          email: "alice.khalil@example.com",
          phone: "76123456",
          address: "Sidon",
          country: "Lebanon"
        }
      },
      update: {
        method: "PUT",
        path: "/api/users/update",
        body: () => ({
          user_id: Number(localStorage.getItem("created_user_id") || 3),
          name: "Alice Khalil",
          email: "alice.khalil@example.com",
          phone: "76987654",
          address: "Jounieh",
          country: "Lebanon"
        })
      },
      delete: {
        method: "DELETE",
        path: () => `/api/users/delete/${localStorage.getItem("created_user_id") || 3}`
      }
    };

    async function run() {
      const test = tests[testCase];
      if (!test) throw new Error(`Unknown verification case: ${testCase}`);

      const path = typeof test.path === "function" ? test.path() : test.path;
      const body = typeof test.body === "function" ? test.body() : test.body;
      document.getElementById("method").textContent = test.method;
      document.getElementById("url").textContent = baseUrl + path;

      if (body) {
        document.getElementById("request-body").classList.remove("muted");
        document.getElementById("request-body").textContent = JSON.stringify(body, null, 2);
      } else {
        document.getElementById("request-panel").remove();
        document.getElementById("grid").classList.add("single");
      }

      const response = await fetch(baseUrl + path, {
        method: test.method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await response.json();

      if (testCase === "add" && data.user_id) {
        localStorage.setItem("created_user_id", data.user_id);
      }

      document.getElementById("status").textContent = `${response.status} ${response.statusText}`;
      document.getElementById("response-body").textContent = JSON.stringify(data, null, 2);
      document.body.dataset.ready = "true";
    }

    run().catch((error) => {
      document.getElementById("status").textContent = "Request failed";
      document.getElementById("response-body").textContent = error.stack || error.message;
      document.body.dataset.ready = "true";
    });
  </script>
</body>
</html>
